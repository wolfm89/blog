baseURL: 'https://blog.wolfgangmoser.eu/'
title: Public Memory
theme: PaperMod
titleCaseStyle: none

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

sitemap:
  changeFreq: monthly
  disable: false
  filename: sitemap.xml
  priority: -1

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Public Memory
  description: "Notes to myself, but public"
  keywords: [Blog, Cloud, AWS, Code, Software, IT]
  author: Wolfgang Moser
  label:
    text: Public Memory
    iconSVG: |
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M12 5h28l19 19v29a5 5 0 0 1-5 5H12a5 5 0 0 1-5-5V10a5 5 0 0 1 5-5Z" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M42 11v12h12L42 11Z" fill="#3aac75"/>
        <path d="M23 30 43 38M23 30l7 17M43 38l-13 9" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="23" cy="30" r="5.5" fill="#3aac75" stroke="currentColor" stroke-width="4"/>
        <circle cx="43" cy="38" r="5.5" fill="#3aac75" stroke="currentColor" stroke-width="4"/>
        <circle cx="30" cy="47" r="5.5" fill="#3aac75" stroke="currentColor" stroke-width="4"/>
      </svg>
  images:
    - /images/og-default.jpg
  mainSections:
    - posts
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  # assets:
  #   # disableHLJS: true # to disable highlight.js
  #   # disableFingerprinting: true
  #   favicon: "<link / abs url>"
  #   favicon16x16: "<link / abs url>"
  #   favicon32x32: "<link / abs url>"
  #   apple_touch_icon: "<link / abs url>"
  #   safari_pinned_tab: "<link / abs url>"

  # label:
  #   text: "Home"
  #   icon: /apple-touch-icon.png
  #   iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Public Memory
    subtitle: "Notes to myself, but public"
    imageUrl: "/images/me.png"
    imageWidth: 150
    imageHeight: 150
    # imageTitle: my image

  # home-info mode
  # homeInfoParams:
  #   Title: "Public Memory"
  #   Content: Notes to myself, but public

  socialIcons:
    - name: github
      url: "https://github.com/wolfm89"

  footer:
    text: "[Train Price Monitor](https://tpm.wolfgangmoser.eu)"

  # analytics:
  #   google:
  #     SiteVerificationTag: "XYZabc"
  #   bing:
  #     SiteVerificationTag: "XYZabc"
  #   yandex:
  #     SiteVerificationTag: "XYZabc"

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  editPost:
    URL: "https://github.com/wolfm89/blog/tree/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

related:
  includeNewer: true
  threshold: 80
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: keywords
      weight: 50
    - name: date
      weight: 10

languages:
  en:
    label: "English"
    locale: "en-US"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series

menu:
  main:
    - identifier: about
      name: about
      url: /about/
      weight: 10
    - identifier: posts
      name: posts
      url: /posts/
      weight: 15
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
    - identifier: search
      name: search
      url: /search/
      weight: 30

markup:
  highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

