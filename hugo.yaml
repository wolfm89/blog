baseURL: 'https://blog.wolfgangmoser.eu/'
title: Public Memory
theme: PaperMod
titleCaseStyle: none

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

sitemap:
  changeFreq: monthly
  disable: false
  filename: sitemap.xml
  priority: -1

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Public Memory
  description: "Notes to myself, but public"
  keywords: [Blog, Cloud, AWS, Code, Software, IT]
  author: Wolfgang Moser
  label:
    text: Public Memory
    iconSVG: |
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M39 4v14h14L39 4Z" fill="var(--logo-accent)"/>
        <path d="M15 4h24l14 14v38a4 4 0 0 1-4 4H15a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M39 4v14h14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 25 42 33M22 25l7 19M42 33l-13 11" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="22" cy="25" r="5" fill="var(--logo-accent)" stroke="var(--logo-node-ring)" stroke-width="3"/>
        <circle cx="42" cy="33" r="5" fill="var(--logo-accent)" stroke="var(--logo-node-ring)" stroke-width="3"/>
        <circle cx="29" cy="44" r="5" fill="var(--logo-accent)" stroke="var(--logo-node-ring)" stroke-width="3"/>
      </svg>
  images:
    - /images/og-default-v2.jpg
  mainSections:
    - posts
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # Versioned URLs force browsers to refresh cached favicons after changes.
    favicon: "/favicon.ico?v=20261110-4"
    favicon16x16: "/favicon-16x16.png?v=20261110-4"
    favicon32x32: "/favicon-32x32.png?v=20261110-4"
    apple_touch_icon: "/apple-touch-icon.png?v=20261110-4"
    safari_pinned_tab: "/safari-pinned-tab.svg?v=20261110-4"

  # label:
  #   text: "Home"
  #   icon: /apple-touch-icon.png
  #   iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Public Memory
    subtitle: "Notes to myself, but public"
    imageUrl: "/images/me.png"
    imageWidth: 128
    imageHeight: 128
    # imageTitle: my image

  # home-info mode
  # homeInfoParams:
  #   Title: "Public Memory"
  #   Content: Notes to myself, but public

  socialIcons:
    - name: github
      url: "https://github.com/wolfm89"
      title: GitHub
    - name: linkedin
      url: "https://www.linkedin.com/in/wolfgang-moser/"
      title: LinkedIn

  footer:
    text: "[Train Price Monitor](https://tpm.wolfgangmoser.eu) · [wolfgangmoser.eu](https://wolfgangmoser.eu)"

  # analytics:
  #   google:
  #     SiteVerificationTag: "XYZabc"
  #   bing:
  #     SiteVerificationTag: "XYZabc"
  #   yandex:
  #     SiteVerificationTag: "XYZabc"

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  editPost:
    URL: "https://github.com/wolfm89/blog/tree/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

related:
  includeNewer: true
  threshold: 80
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: keywords
      weight: 50
    - name: date
      weight: 10

languages:
  en:
    label: "English"
    locale: "en-US"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series

menu:
  main:
    - identifier: about
      name: about
      url: /about/
      weight: 10
    - identifier: posts
      name: posts
      url: /posts/
      weight: 15
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
    - identifier: search
      name: search
      url: /search/
      weight: 30

markup:
  highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

