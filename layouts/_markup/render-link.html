{{- $u := urls.Parse .Destination -}}
{{- $siteU := urls.Parse site.BaseURL -}}
{{- $external := and $u.IsAbs (ne $u.Host $siteU.Host) -}}
<a href="{{ .Destination | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  {{- if $external }} target="_blank" rel="noopener noreferrer"{{ end -}}
>{{ .Text | safeHTML }}</a>
{{- /**/ -}}
