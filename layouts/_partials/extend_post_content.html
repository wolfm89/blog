{{- $related := site.RegularPages.Related . | first 3 }}
{{- with $related }}
<section class="related-posts" aria-labelledby="related-posts-title">
  <h2 id="related-posts-title">Related posts</h2>
  <ul>
    {{- range . }}
    <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
    {{- end }}
  </ul>
</section>
{{- end }}
